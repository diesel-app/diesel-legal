<style>
:root { color-scheme: light; --navy:#172b4d; --gold:#c8a96a; --bg:#f3f5f8; --text:#1e293b; }
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { margin:0; background:var(--bg); color:var(--text); font-family:Tahoma, Arial, sans-serif; }
header { background:var(--navy); color:white; padding:22px 16px 18px; text-align:center; border-bottom:4px solid var(--gold); }
.brand { font-size:13px; letter-spacing:.08em; opacity:.85; direction:ltr; }
h1 { font-size:clamp(21px, 4vw, 30px); margin:8px 0 5px; }
.subtitle { margin:0; font-size:13px; opacity:.82; }
main { width:min(100%, 980px); margin:24px auto; padding:0 12px 28px; }

.pdf-page { margin:0 auto 18px; max-width:820px; background:white; border:1px solid #e1e5eb; border-radius:4px; overflow:hidden; box-shadow:0 4px 16px rgba(15,23,42,.06); }
.pdf-page img { display:block; width:100%; height:auto; }
footer { text-align:center; padding:20px 12px 28px; color:#64748b; font-size:12px; }
@media (max-width:600px) {
  header { padding:18px 12px 15px; }
  main { margin:14px auto; padding:0 7px 20px; }
  .pdf-page { margin-bottom:10px; }
  .notice { font-size:12px; }
}
@media print {
  body { background:white; }
  header, .notice, footer { display:none; }
  main { width:100%; margin:0; padding:0; }
  .pdf-page { box-shadow:none; border:0; margin:0; page-break-after:always; }
}
</style>
